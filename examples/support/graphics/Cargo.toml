[package]
name = "contime-graphics-example"
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bevy = { version = "=0.19.1", default-features = false, features = ["std", "async_executor", "bevy_asset", "bevy_log", "bevy_window", "bevy_winit", "bevy_camera", "bevy_render", "bevy_core_pipeline", "bevy_gizmos", "bevy_gizmos_render", "bevy_sprite", "bevy_sprite_render", "webgl2", "x11", "wayland"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.127"

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 2
lto = "thin"
