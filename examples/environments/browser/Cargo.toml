[package]
name = "contime-browser-example"
version = "0.0.0"
edition = "2021"
rust-version = "1.90"
publish = false

[workspace]

[lib]
path = "../../support/composition/browser/lib.rs"
crate-type = ["cdylib", "rlib"]

[features]
default = ["manual"]
manual = ["macros"]
macros = ["contime/macros"]

[dev-dependencies]

[dependencies]
crossbeam-channel = "0.5"
contime = { path = "../../..", default-features = false, features = ["manual", "monitor", "simulator", "macros"] }
blake3 = "1.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.127"
getrandom = { version = "0.3", features = ["wasm_js"] }

# Shared host modules recognize Runtime, but browsers only expose Manual.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("runtime"))'] }
