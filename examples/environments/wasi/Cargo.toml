[package]
name = "contime-wasm-example"
version = "0.0.0"
edition = "2021"
rust-version = "1.90"
publish = false

[workspace]

[lib]
path = "../../support/composition/wasi/lib.rs"

[[bin]]
name = "contime-wasm-example"
path = "../../support/composition/wasi/main.rs"

[features]
default = ["manual"]
manual = ["macros"]
macros = ["contime/macros"]
runtime = ["manual", "contime/runtime"]

[dependencies]
crossbeam-channel = "0.5"
contime = { path = "../../..", default-features = false, features = ["manual", "monitor", "simulator", "macros"] }
blake3 = "1.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]

[[test]]
name = "metrics_stdio"
path = "../../support/composition/wasi/metrics_stdio.rs"

[target.'cfg(any(unix, target_os = "wasi"))'.dependencies]
libc = "0.2"
