name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Rust ${{ matrix.toolchain }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        toolchain: ["1.90.0", stable]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal
      - name: Test workspace and Rust documentation examples
        run: cargo +${{ matrix.toolchain }} test --workspace
      - name: Test optional features
        run: cargo +${{ matrix.toolchain }} test --workspace --all-features
      - name: Check isolated Monitor features
        run: |
          cargo +${{ matrix.toolchain }} check -p contime-monitor --no-default-features --lib
          cargo +${{ matrix.toolchain }} check -p contime-monitor --no-default-features --features monitor --lib
          cargo +${{ matrix.toolchain }} check -p contime-monitor --no-default-features --features workers --lib
          cargo +${{ matrix.toolchain }} check -p contime-monitor --no-default-features --features runtime --lib
      - name: Test independent simulation
        run: |
          cargo +${{ matrix.toolchain }} test -p contime --no-default-features --features simulator --lib
          cargo +${{ matrix.toolchain }} test -p contime-simulator --no-default-features
          cargo +${{ matrix.toolchain }} test -p contime-simulator --features monitor
      - name: Test Manual without managed Runtime
        run: cargo +${{ matrix.toolchain }} test -p contime --no-default-features --features manual --test manual
      - name: Test lean Runtime without tools or counters
        run: cargo +${{ matrix.toolchain }} test -p contime --no-default-features --features runtime
      - name: Test monitoring without Manual or simulation
        run: cargo +${{ matrix.toolchain }} test -p contime --features monitor --test progress
      - name: Test example verification logic
        run: cargo +${{ matrix.toolchain }} test -p contime --all-features --examples
      - name: Check all targets, including benchmarks
        run: cargo +${{ matrix.toolchain }} check --workspace --all-targets
      - name: Check minimal example feature sets
        run: |
          cargo +${{ matrix.toolchain }} check -p contime --all-targets
          cargo +${{ matrix.toolchain }} check -p contime --no-default-features --features runtime --all-targets
          cargo +${{ matrix.toolchain }} check -p contime --no-default-features --features runtime,monitor --example launcher
          cargo +${{ matrix.toolchain }} check -p contime --no-default-features --features runtime,monitor --all-targets
          cargo +${{ matrix.toolchain }} check -p contime --no-default-features --features manual,monitor --all-targets
          cargo +${{ matrix.toolchain }} check -p contime --no-default-features --features runtime,monitor,simulator --example counter_live --example chain_hash --example client_movement
          cargo +${{ matrix.toolchain }} check -p contime --no-default-features --features manual,monitor,simulator --example manual_counter_live
      - name: Run native counter through the launcher
        run: cargo +${{ matrix.toolchain }} run -p contime --features monitor --example launcher -- --environment native --example counter --no-setup -- --headless --duration 1 --workers 2 --snapshots 8 --events-per-second 1000
      - name: Run counter walkthrough
        run: cargo +${{ matrix.toolchain }} run -p contime --example counter
      - name: Run client-movement example
        run: cargo +${{ matrix.toolchain }} run -p contime --features manual,monitor,simulator --example client_movement -- --headless --duration 1 --clients 8

  release-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install Rust tools
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        run: cargo +1.90.0 fmt --all -- --check
      - name: Check lints
        run: cargo +1.90.0 clippy --workspace --all-targets --all-features -- -D warnings
      - name: Build Rust documentation with warnings denied
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +1.90.0 doc --workspace --all-features --no-deps
      - name: Run counter walkthrough
        run: cargo +1.90.0 run -p contime --example counter
      - name: Verify single-package release without uploading
        run: cargo +1.90.0 publish -p contime --all-features --dry-run
      - name: Test packaged examples
        run: |
          package_version="$(cargo +1.90.0 metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "contime"))')"
          cargo +1.90.0 test --manifest-path "target/package/contime-${package_version}/Cargo.toml" --all-features --examples
