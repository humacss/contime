name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Rust ${{ matrix.toolchain }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        toolchain: ["1.90.0", stable]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal
      - name: Test workspace and Rust documentation examples
        run: cargo +${{ matrix.toolchain }} test --workspace
      - name: Test optional features
        run: cargo +${{ matrix.toolchain }} test --workspace --all-features
      - name: Check isolated Monitor features
        run: |
          cargo +${{ matrix.toolchain }} check -p contime-monitor --no-default-features --lib
          cargo +${{ matrix.toolchain }} check -p contime-monitor --no-default-features --features monitor --lib
          cargo +${{ matrix.toolchain }} check -p contime-monitor --no-default-features --features workers --lib
          cargo +${{ matrix.toolchain }} check -p contime-monitor --no-default-features --features runtime --lib
      - name: Check custom-time Manual without built-in time
        run: cargo +${{ matrix.toolchain }} check -p contime --no-default-features --features manual --lib
      - name: Test independent simulation
        run: |
          cargo +${{ matrix.toolchain }} test -p contime --no-default-features --features simulator --lib --test simulator
          cargo +${{ matrix.toolchain }} test -p contime-simulator --no-default-features
          cargo +${{ matrix.toolchain }} test -p contime-simulator --features monitor
      - name: Test Manual without managed Runtime
        run: cargo +${{ matrix.toolchain }} test -p contime --no-default-features --features manual --test manual
      - name: Test Manual with monitoring and simulation without Runtime
        run: cargo +${{ matrix.toolchain }} test -p contime --no-default-features --features manual,monitor,simulator --test manual --test monitor --test simulator
      - name: Test lean Runtime without tools or counters
        run: cargo +${{ matrix.toolchain }} test -p contime --no-default-features --features runtime
      - name: Test Monitor without an execution backend
        run: cargo +${{ matrix.toolchain }} test -p contime --no-default-features --features monitor --test monitor
      - name: Test monitoring without Manual or simulation
        run: cargo +${{ matrix.toolchain }} test -p contime --features monitor --test monitor
      - name: Test launcher bootstrap with default features
        run: cargo +${{ matrix.toolchain }} test -p contime --example launcher
      - name: Test example verification logic
        run: cargo +${{ matrix.toolchain }} test -p contime --all-features --examples
      - name: Check all targets, including benchmarks
        run: cargo +${{ matrix.toolchain }} check --workspace --all-targets
      - name: Check example targets with their shared feature set
        run: cargo +${{ matrix.toolchain }} check -p contime --all-features --all-targets
      - name: Run native counter through the launcher
        run: cargo +${{ matrix.toolchain }} run -p contime --example launcher -- --environment native --example counter --no-setup -- --headless --duration 1 --workers 2 --snapshots 8 --events-per-second 1000
      - name: Run Manual counter through the launcher
        run: cargo +${{ matrix.toolchain }} run -p contime --example launcher -- --environment native --execution manual --example counter --no-setup -- --headless --duration 1 --snapshots 8 --events-per-second 1000
      - name: Run counter walkthrough with derives
        run: cargo +${{ matrix.toolchain }} run -p contime --example readme --features macros
      - name: Run ordered-list walkthrough
        run: cargo +${{ matrix.toolchain }} run -p contime --example ordered_list --features macros
      - name: Run client-movement example
        run: cargo +${{ matrix.toolchain }} run -p contime --all-features --example client_movement -- --headless --duration 1 --clients 8

  release-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install Rust tools
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        run: cargo +1.90.0 fmt --all -- --check
      - name: Check lints
        run: cargo +1.90.0 clippy --workspace --all-targets --all-features -- -D warnings
      - name: Build Rust documentation with warnings denied
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +1.90.0 doc --workspace --all-features --no-deps
      - name: Run counter walkthrough with derives
        run: cargo +1.90.0 run -p contime --example readme --features macros
      - name: Run ordered-list walkthrough
        run: cargo +1.90.0 run -p contime --example ordered_list --features macros
      - name: Check standalone component benchmark targets
        run: cargo +1.90.0 bench --workspace --all-features --no-run
      - name: Check packaged component sources
        run: |
          cargo +1.90.0 package -p contime --list --all-features > package-files.txt
          python3 - <<'PYTHON'
          from pathlib import Path
          import tomllib
          root = Path.cwd()
          files = set(Path("package-files.txt").read_text().splitlines())
          components = [p.parent for p in Path("crates").glob("*/Cargo.toml")
                        if tomllib.loads(p.read_text())["package"].get("publish") is False]
          assert components, "No development components found"
          for component in components:
              linked = Path("src/_symlinks") / component.name
              link = linked / "src"
              assert link.is_symlink(), f"Expected a symbolic link: {link}"
              assert link.resolve(strict=True) == (root / component / "src").resolve(strict=True)
              for source in (component / "src").rglob("*.rs"):
                  assert (linked / source.relative_to(component)).as_posix() in files, source
              assert not (linked / "README.md").exists()
          assert "src/_symlinks/README.md" in files
          fixtures = Path("src/_symlinks/runtime/tests/controlled")
          assert fixtures.is_symlink()
          assert fixtures.resolve(strict=True) == (root / "crates/runtime/tests/controlled").resolve(strict=True)
          for source in Path("crates/runtime/tests/controlled").rglob("*.rs"):
              assert (fixtures / source.relative_to("crates/runtime/tests/controlled")).as_posix() in files
          assert not any(p.startswith(("crates/", "component-packages/")) for p in files)
          PYTHON
      - name: Verify release packages without uploading
        run: |
          cargo +1.90.0 package -p contime-macros
          cargo +1.90.0 publish -p contime --all-features --dry-run --config "patch.crates-io.contime-macros.path=\"$PWD/crates/macros\""
      - name: Extract the package outside the checkout
        run: |
          python3 - <<'PYTHON' > package-root.txt
          from pathlib import Path
          import json, os, tarfile, tempfile, tomllib
          root = Path.cwd()
          package = tomllib.loads(Path("Cargo.toml").read_text())["package"]
          name = f"{package['name']}-{package['version']}"
          destination = Path(tempfile.mkdtemp(prefix="contime-package-", dir=os.environ["RUNNER_TEMP"]))
          macros = tomllib.loads((root / "crates/macros/Cargo.toml").read_text())["package"]
          macro_name = f"{macros['name']}-{macros['version']}"
          for archived in (name, macro_name):
              with tarfile.open(root / "target/package" / f"{archived}.crate") as archive:
                  assert all(not p.issym() and not p.islnk() for p in archive.getmembers())
                  archive.extractall(destination, filter="data")
          extracted = destination / name
          manifest = tomllib.loads((extracted / "Cargo.toml").read_text())
          assert not (extracted / "crates").exists()
          assert all(not dep.startswith("contime-") or dep == "contime-macros"
                     for dep in manifest.get("dependencies", {}))
          # The compiler companion is also taken from its own verified archive.
          config = extracted / ".cargo/config.toml"
          config.parent.mkdir()
          config.write_text("[patch.crates-io]\ncontime-macros = { path = "
                            + json.dumps(str(destination / macro_name)) + " }\n")
          print(extracted)
          PYTHON
      - name: Test the extracted package and examples
        run: |
          package_root="$(cat package-root.txt)"
          export CARGO_TARGET_DIR="$package_root/target"
          cd "$package_root"
          cargo +1.90.0 test --all-features
          cargo +1.90.0 test --all-features --examples
