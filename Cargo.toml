[package]
name = "contime"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
autobenches = false
autoexamples = false
license = "MIT"
description = "Continuous-time state from unreliable event streams"
publish = ["crates-io"]
repository = "https://github.com/humacss/contime"
documentation = "https://docs.rs/contime"
readme = "README.md"
authors = ["humacss"]
keywords = ["events", "history", "replay", "snapshots"]
categories = ["data-structures", "concurrency"]
include = ["/Cargo.toml", "/LICENSE", "/README.md", "/src/**", "/examples/**", "/tests/**", "/benches/**", "!**/docs/**", "!**/.DS_Store"]

[features]
default = ["runtime"]
runtime = ["dep:contime-runtime", "contime-monitor?/runtime"]
monitor = ["dep:contime-monitor", "contime-monitor/workers"]
counters = ["contime-core/counters", "contime-runtime?/counters", "contime-monitor?/counters"]
simulator = ["monitor", "dep:contime-simulator"]
manual = ["dep:contime-manual", "dep:contime-api", "dep:contime-worker", "contime-api/manual"]

[dependencies]
contime-simulator = { path = "crates/simulator", version = "0.1.0", optional = true }
contime-monitor = { path = "crates/monitor", version = "0.1.0", optional = true }
contime-api = { path = "crates/api", version = "0.1.0", optional = true }
contime-worker = { path = "crates/worker", version = "0.1.0", optional = true }
contime-manual = { path = "crates/manual", version = "0.1.0", optional = true }
contime-core = { path = "crates/core", version = "0.1.0" }
contime-runtime = { path = "crates/runtime", version = "0.1.0", optional = true }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
contime-monitor = { path = "crates/monitor", version = "0.1.0", features = ["workers"] }
contime-simulator = { path = "crates/simulator", version = "0.1.0" }
contime-api = { path = "crates/api", version = "0.1.0" }
contime-router = { path = "crates/router", version = "0.1.0" }
contime-worker = { path = "crates/worker", version = "0.1.0" }
crossbeam-channel = "0.5"
blake3 = "1.8"
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "layout-cache"] }
ctrlc = { version = "3.5", features = ["termination"] }
fastrand = "2"
rstest = { version = "0.26", default-features = false }
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "apply"
harness = false
required-features = ["runtime"]

[[bench]]
name = "query"
harness = false
required-features = ["runtime"]

[[bench]]
name = "advance"
harness = false
required-features = ["runtime"]

[[bench]]
name = "listen"
harness = false
required-features = ["runtime"]

[workspace]
resolver = "2"
exclude = ["examples/environments/wasi", "examples/environments/browser"]
members = [
    "crates/api",
    "crates/batcher",
    "crates/core",
    "crates/events",
    "crates/lanes",
    "crates/manual",
    "crates/monitor",
    "crates/simulator",
    "crates/progress",
    "crates/router",
    "crates/runtime",
    "crates/snapshots",
    "crates/worker",
]

[package.metadata.docs.rs]
all-features = true

[[example]]
name = "chain_hash"
path = "examples/support/entrypoints/chain_hash.rs"
required-features = ["runtime", "monitor", "counters"]

[[example]]
name = "counter"
path = "examples/cases/counter/main.rs"
required-features = ["runtime"]

[[test]]
name = "advance"
required-features = ["runtime"]

[[test]]
name = "incremental"
required-features = ["runtime"]

[[test]]
name = "internal_batching"
required-features = ["runtime"]

[[test]]
name = "listen"
required-features = ["runtime"]

[[test]]
name = "manual"
required-features = ["manual"]

[[test]]
name = "progress"
required-features = ["runtime"]

[[test]]
name = "query"
required-features = ["runtime"]

[[test]]
name = "replay_boundary"
required-features = ["runtime"]

[[test]]
name = "replay_frontier"
required-features = ["runtime"]

[[example]]
name = "manual_counter"
path = "examples/cases/counter/manual.rs"
required-features = ["manual"]

[[example]]
name = "counter_live"
path = "examples/support/entrypoints/counter.rs"
required-features = ["runtime", "monitor", "counters"]

[[example]]
name = "manual_counter_live"
path = "examples/support/entrypoints/manual_counter.rs"
required-features = ["manual", "monitor", "counters"]

[[example]]
name = "launcher"
path = "examples/support/launcher/main.rs"
required-features = ["runtime"]

[[bench]]
name = "monitor_ui"
harness = false
required-features = ["monitor"]

[[example]]
name = "client_movement"
path = "examples/support/entrypoints/client_movement.rs"
required-features = ["runtime", "monitor", "counters"]
