[package]
name = "contime"
version = "0.1.1"
edition = "2021"
rust-version = "1.90"
autobenches = false
autoexamples = false
license = "MIT"
description = "Continuous-time state from unreliable event streams"
publish = ["crates-io"]
repository = "https://github.com/humacss/contime"
documentation = "https://docs.rs/contime"
readme = "README.md"
authors = ["humacss"]
keywords = ["events", "history", "replay", "snapshots"]
categories = ["data-structures", "concurrency"]
include = [
    "/Cargo.toml",
    "/LICENSE",
    "/README.md",
    "/src/**",
    "/crates/*/src/**",
    "/crates/*/README.md",
    "/crates/runtime/tests/controlled/**",
    "/examples/**",
    "/tests/**",
    "/benches/**",
    "!**/docs/**",
    "!**/pkg/**",
    "!**/target/**",
    "!**/.DS_Store",
]

[features]
default = ["runtime"]
runtime = ["dep:traitstub"]
monitor = []
simulator = []
manual = ["dep:traitstub"]

[dependencies]
ahash = "0.8"
crossbeam-channel = "0.5"
traitstub = { version = "0.1.0", optional = true }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossbeam-channel = "0.5"
blake3 = "1.8"
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "layout-cache"] }
ctrlc = { version = "3.5", features = ["termination"] }
fastrand = "2"
rstest = { version = "0.26", default-features = false }
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "apply"
harness = false
required-features = ["runtime"]

[[bench]]
name = "query"
harness = false
required-features = ["runtime"]

[[bench]]
name = "advance"
harness = false
required-features = ["runtime"]

[[bench]]
name = "listen"
harness = false
required-features = ["runtime"]

[workspace]
resolver = "2"
exclude = ["examples/environments/wasi", "examples/environments/browser", "benches/scaling"]
members = [
    "crates/api/dev",
    "crates/batcher/dev",
    "crates/core/dev",
    "crates/events/dev",
    "crates/lanes/dev",
    "crates/manual/dev",
    "crates/monitor/dev",
    "crates/simulator/dev",
    "crates/progress/dev",
    "crates/router/dev",
    "crates/runtime/dev",
    "crates/snapshots/dev",
    "crates/worker/dev",
]

[package.metadata.docs.rs]
all-features = true

[[example]]
name = "chain_hash"
path = "examples/support/entrypoints/chain_hash.rs"
required-features = ["runtime", "monitor", "simulator"]

[[example]]
name = "counter"
path = "examples/cases/counter/main.rs"
required-features = ["runtime"]

[[test]]
name = "advance"
required-features = ["runtime"]

[[test]]
name = "incremental"
required-features = ["runtime"]

[[test]]
name = "internal_batching"
required-features = ["runtime"]

[[test]]
name = "listen"
required-features = ["runtime"]

[[test]]
name = "manual"
required-features = ["manual"]

[[test]]
name = "progress"
required-features = ["runtime"]

[[test]]
name = "query"
required-features = ["runtime"]

[[test]]
name = "replay_boundary"
required-features = ["runtime"]

[[test]]
name = "replay_frontier"
required-features = ["runtime"]

[[example]]
name = "manual_counter"
path = "examples/cases/counter/manual.rs"
required-features = ["manual"]

[[example]]
name = "counter_live"
path = "examples/support/entrypoints/counter.rs"
required-features = ["runtime", "monitor", "simulator"]

[[example]]
name = "manual_counter_live"
path = "examples/support/entrypoints/manual_counter.rs"
required-features = ["manual", "monitor", "simulator"]

[[example]]
name = "launcher"
path = "examples/support/launcher/main.rs"
required-features = ["runtime", "monitor"]

[[bench]]
name = "monitor_ui"
harness = false
required-features = ["monitor"]

[[example]]
name = "client_movement"
path = "examples/support/entrypoints/client_movement.rs"
required-features = ["runtime", "monitor", "simulator"]
