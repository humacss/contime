[package]
name = "contime"
version = "0.1.0"
edition = "2021"
autobenches = false
license = "MIT"
description = "Continuous-time state from unreliable event streams"
publish = false
repository = "https://github.com/humacss/contime"
documentation = "https://docs.rs/contime"
readme = "README.md"
authors = ["humacss"]
keywords = ["events", "history", "replay", "snapshots"]
categories = ["data-structures", "concurrency"]
include = ["/Cargo.toml", "/LICENSE", "/README.md", "/src/**", "/examples/**", "/tests/**", "/benches/**", "!**/docs/**", "!**/.DS_Store"]

[dependencies]
contime-api = { path = "crates/api", version = "0.1.0" }
contime-core = { path = "crates/core", version = "0.1.0" }
contime-router = { path = "crates/router", version = "0.1.0" }
contime-runtime = { path = "crates/runtime", version = "0.1.0" }
contime-worker = { path = "crates/worker", version = "0.1.0" }
crossbeam-channel = "0.5"

[dev-dependencies]
blake3 = "1.8"
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "layout-cache"] }
ctrlc = { version = "3.5", features = ["termination"] }
fastrand = "2"
contentid = { version = "1.0.0", features = ["local"] }
rstest = { version = "0.26", default-features = false }
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "apply"
harness = false

[[bench]]
name = "query"
harness = false

[[bench]]
name = "advance"
harness = false

[[bench]]
name = "listen"
harness = false

[workspace]
resolver = "2"
members = [
    "crates/api",
    "crates/core",
    "crates/events",
    "crates/lanes",
    "crates/progress",
    "crates/router",
    "crates/runtime",
    "crates/snapshots",
    "crates/worker",
]

[package.metadata.docs.rs]
all-features = true
