[package]
name = "contime"
version = "0.1.0"
edition = "2021"
autobenches = false
license = "MIT"
description = "Continuous-time state from unreliable event streams"
publish = false

[dependencies]
contime-api = { path = "crates/api" }
contime-core = { path = "crates/core" }
contime-router = { path = "crates/router" }
contime-runtime = { path = "crates/runtime" }
contime-worker = { path = "crates/worker" }
crossbeam-channel = "0.5"

[dev-dependencies]
rstest = { version = "0.26", default-features = false }
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "apply"
harness = false

[[bench]]
name = "query"
harness = false

[[bench]]
name = "advance"
harness = false

[[bench]]
name = "listen"
harness = false

[workspace]
resolver = "2"
members = [
    "crates/api",
    "crates/core",
    "crates/events",
    "crates/lanes",
    "crates/progress",
    "crates/router",
    "crates/runtime",
    "crates/snapshots",
    "crates/worker",
]
