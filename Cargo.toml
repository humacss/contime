[package]
name = "contime"
version = "0.1.1"
edition = "2021"
rust-version = "1.90"
autobenches = false
autoexamples = false
autotests = false
license = "MIT"
description = "Continuous-time state from unreliable event streams"
publish = ["crates-io"]
repository = "https://github.com/humacss/contime"
documentation = "https://docs.rs/contime"
readme = "README.md"
authors = ["humacss"]
keywords = ["events", "history", "replay", "snapshots"]
categories = ["data-structures", "concurrency"]
include = [
    "/Cargo.toml",
    "/LICENSE",
    "/README.md",
    "/src/**",
    "/examples/**",
    "/tests/**",
    "/benches/**",
    "!**/docs/**",
    "!**/pkg/**",
    "!**/target/**",
    "!**/.DS_Store",
]

[features]
default = ["runtime", "time"]
time = []
macros = ["dep:contime-macros", "dep:contentid", "dep:blake3"]
runtime = ["dep:traitstub"]
monitor = []
simulator = []
manual = ["dep:traitstub"]

[dependencies]
contime-macros = { path = "crates/macros", version = "0.1.2", optional = true }
contentid = { version = "1.0.0", default-features = false, features = ["local"], optional = true }
blake3 = { version = "1.8", optional = true }
ahash = "0.8"
crossbeam-channel = "0.5"
traitstub = { version = "0.1.0", optional = true }

[dev-dependencies]
trybuild = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossbeam-channel = "0.5"
blake3 = "1.8"
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "layout-cache"] }
ctrlc = { version = "3.5", features = ["termination"] }
fastrand = "2"
rstest = { version = "0.26", default-features = false }
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "apply"
harness = false
required-features = ["runtime"]

[[bench]]
name = "query"
harness = false
required-features = ["runtime"]

[[bench]]
name = "advance"
harness = false
required-features = ["runtime"]

[[bench]]
name = "listen"
harness = false
required-features = ["runtime"]

[workspace]
resolver = "2"
exclude = ["examples/environments/wasi", "examples/environments/browser", "benches/scaling"]
members = [
    "crates/macros",
    "crates/time",
    "crates/api",
    "crates/batcher",
    "crates/core",
    "crates/events",
    "crates/lanes",
    "crates/manual",
    "crates/monitor",
    "crates/simulator",
    "crates/progress",
    "crates/router",
    "crates/runtime",
    "crates/snapshots",
    "crates/worker",
]

[package.metadata.docs.rs]
all-features = true

[[bench]]
name = "monitor_ui"
harness = false
required-features = ["monitor"]

# Integration suites are grouped by public feature; topic files remain modules.

[[test]]
name = "runtime"
path = "tests/runtime/main.rs"
required-features = ["runtime"]

[[test]]
name = "manual"
path = "tests/manual/main.rs"
required-features = ["manual"]

[[test]]
name = "monitor"
path = "tests/monitor/main.rs"
required-features = ["monitor"]

[[test]]
name = "simulator"
path = "tests/simulator/main.rs"
required-features = ["simulator"]

# The launcher enables its dashboard and workload features automatically.
# Start with `cargo run --example launcher`; use --release for performance runs.

[[example]]
name = "launcher"
path = "examples/support/launcher/main.rs"

[[example]]
name = "readme"
path = "examples/cases/counter/readme.rs"
required-features = ["runtime"]

[[example]]
name = "counter"
path = "examples/support/entrypoints/counter.rs"
required-features = ["runtime", "manual", "monitor", "simulator"]

[[example]]
name = "chain_hash"
path = "examples/support/entrypoints/chain_hash.rs"
required-features = ["runtime", "manual", "monitor", "simulator"]

[[example]]
name = "client_movement"
path = "examples/support/entrypoints/client_movement.rs"
required-features = ["runtime", "manual", "monitor", "simulator"]

[[test]]
name = "modules"
path = "tests/modules/main.rs"
required-features = ["macros", "runtime", "manual", "time"]

[[example]]
name = "modules"
path = "examples/cases/modules/main.rs"
required-features = ["macros", "runtime", "time"]
