[package]
name = "contime-simulator"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "MIT"
description = "Caller-driven load simulation and admission control for ConTime"
publish = ["crates-io"]
repository = "https://github.com/humacss/contime"
documentation = "https://docs.rs/contime-simulator"
authors = ["humacss"]
keywords = ["events", "simulation", "benchmark", "snapshots"]
categories = ["development-tools::testing"]
readme = "README.md"
include = ["/Cargo.toml", "/LICENSE", "/README.md", "/src/**", "/tests/**", "/examples/**"]

[dependencies]
contime-monitor = { path = "../monitor", version = "0.1.0" }
