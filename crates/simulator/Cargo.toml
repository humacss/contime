[package]
name = "contime-simulator"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "MIT"
description = "Caller-driven load simulation and admission control for ConTime"
publish = false
repository = "https://github.com/humacss/contime"
documentation = "https://docs.rs/contime-simulator"
authors = ["humacss"]
keywords = ["events", "simulation", "benchmark", "snapshots"]
categories = ["development-tools::testing"]
readme = "README.md"

[features]
default = []
monitor = ["dep:contime-monitor"]

[dependencies]
contime-monitor = { path = "../monitor", version = "0.1.0", optional = true }

[lib]
path = "src/lib.rs"

[[test]]
name = "controller"
path = "tests/controller.rs"
required-features = ["monitor"]

[[test]]
name = "event_stream"
path = "tests/event_stream.rs"

[[test]]
name = "simulation"
path = "tests/simulation.rs"
required-features = ["monitor"]

[[test]]
name = "slow_queries"
path = "tests/slow_queries.rs"
required-features = ["monitor"]

[[example]]
name = "event_stream"
path = "examples/event_stream.rs"

[dev-dependencies]
contime = { path = "../..", features = ["monitor", "simulator", "manual"] }
