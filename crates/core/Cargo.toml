[package]
name = "contime-core"
version = "0.1.0"
edition = "2021"
autobenches = false
license = "MIT"
description = "Protocol and storage adapters for isolated ConTime subsystems"
publish = false

[dependencies]
contime-api = { path = "../api" }
contime-checkpoints = { package = "contime-snapshots", path = "../snapshots" }
contime-events = { path = "../events" }
contime-lanes = { path = "../lanes" }
contime-progress = { path = "../progress" }
contime-router = { path = "../router" }
contime-runtime = { path = "../runtime" }
contime-worker = { path = "../worker" }
crossbeam-channel = "0.5"

[dev-dependencies]
rstest = { version = "0.26", default-features = false }
criterion = { version = "0.5", features = ["html_reports"] }
