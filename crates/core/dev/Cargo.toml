[package]
name = "contime-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
autobenches = false
license = "MIT"
description = "Shared application contracts and synchronous ConTime storage adapters"
publish = false
repository = "https://github.com/humacss/contime"
documentation = "https://docs.rs/contime-core"
readme = "../README.md"
authors = ["humacss"]
keywords = ["events", "history", "replay", "snapshots"]
categories = ["data-structures", "concurrency"]

[features]
monitor = ["contime-worker/monitor", "contime-checkpoints/monitor"]

[dependencies]
contime-checkpoints = { package = "contime-snapshots", path = "../../snapshots/dev", version = "0.1.0" }
contime-events = { path = "../../events/dev", version = "0.1.0" }
contime-lanes = { path = "../../lanes/dev", version = "0.1.0" }
contime-worker = { path = "../../worker/dev", version = "0.1.0" }

[dev-dependencies]
rstest = { version = "0.26", default-features = false }
criterion = { version = "0.5", features = ["html_reports"] }

[lib]
path = "lib.rs"

[package.metadata.docs.rs]
all-features = true

[[test]]
name = "local_input"
path = "../tests/local_input.rs"
