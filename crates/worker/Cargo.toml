[package]
name = "contime-worker"
version = "0.1.0"
edition = "2021"
autobenches = false
license = "MIT"
description = "Isolated worker-side replay orchestration for ConTime"
publish = false
repository = "https://github.com/humacss/contime"
documentation = "https://docs.rs/contime-worker"
readme = "README.md"
authors = ["humacss"]
keywords = ["events", "history", "replay", "snapshots"]
categories = ["data-structures", "concurrency"]
include = ["/Cargo.toml", "/LICENSE", "/README.md", "/src/**", "/examples/**", "/tests/**", "/benches/**", "!**/docs/**", "!**/.DS_Store"]

[features]
default = []
counters = []

[dependencies]
ahash = "0.8"
crossbeam-channel = "0.5"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "messages"
harness = false

[package.metadata.docs.rs]
all-features = true
