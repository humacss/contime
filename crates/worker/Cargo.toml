[package]
name = "contime-worker"
version = "0.1.0"
edition = "2021"
autobenches = false
license = "MIT"
description = "Isolated worker-side replay orchestration for ConTime"
publish = false

[dependencies]
ahash = "0.8"
crossbeam-channel = "0.5"
priority-queue = "2"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "worker_settings"
harness = false
