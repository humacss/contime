[package]
name = "contime-runtime"
version = "0.1.0"
edition = "2021"
autobenches = false
license = "MIT"
description = "Isolated thread and channel orchestration for ConTime"
publish = false
repository = "https://github.com/humacss/contime"
documentation = "https://docs.rs/contime-runtime"
readme = "README.md"
authors = ["humacss"]
keywords = ["events", "history", "replay", "snapshots"]
categories = ["data-structures", "concurrency"]
include = ["/Cargo.toml", "/LICENSE", "/README.md", "/src/**", "/examples/**", "/tests/**", "/benches/**", "!**/docs/**", "!**/.DS_Store"]

[dependencies]
crossbeam-channel = "0.5"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
pprof = { version = "0.15", features = ["criterion", "flamegraph"] }

[[bench]]
name = "runtime"
harness = false

[[bench]]
name = "breakdown"
harness = false

[[bench]]
name = "batching"
harness = false

[package.metadata.docs.rs]
all-features = true
