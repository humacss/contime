[package]
name = "contime-runtime"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
autobenches = false
license = "MIT"
description = "Managed background processing and thread lifecycle for ConTime"
publish = ["crates-io"]
repository = "https://github.com/humacss/contime"
documentation = "https://docs.rs/contime-runtime"
readme = "README.md"
authors = ["humacss"]
keywords = ["events", "history", "replay", "snapshots"]
categories = ["data-structures", "concurrency"]
include = ["/Cargo.toml", "/LICENSE", "/README.md", "/src/**", "/examples/**", "/tests/**", "/benches/**", "!**/docs/**", "!**/.DS_Store"]

[features]
counters = ["contime-worker/counters", "contime-core/counters"]

[dependencies]
traitstub = "0.1.0"
contime-batcher = { path = "../batcher", version = "0.1.0" }
contime-core = { path = "../core", version = "0.1.0" }
contime-api = { path = "../api", version = "0.1.0" }
contime-events = { path = "../events", version = "0.1.0" }
contime-lanes = { path = "../lanes", version = "0.1.0" }
contime-progress = { path = "../progress", version = "0.1.0" }
contime-router = { path = "../router", version = "0.1.0" }
contime-worker = { path = "../worker", version = "0.1.0" }
contime-checkpoints = { package = "contime-snapshots", path = "../snapshots", version = "0.1.0" }
crossbeam-channel = "0.5"

[dev-dependencies]
rstest = { version = "0.26", default-features = false }
criterion = { version = "0.5", features = ["html_reports"] }
pprof = { version = "0.15", features = ["criterion", "flamegraph"] }

[[bench]]
name = "counters"
harness = false

[[bench]]
name = "runtime"
harness = false

[[bench]]
name = "breakdown"
harness = false

[[bench]]
name = "batching"
harness = false

[package.metadata.docs.rs]
all-features = true
