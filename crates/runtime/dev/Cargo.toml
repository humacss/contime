[package]
name = "contime-runtime"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
autobenches = false
license = "MIT"
description = "Managed background processing and thread lifecycle for ConTime"
publish = false
repository = "https://github.com/humacss/contime"
documentation = "https://docs.rs/contime-runtime"
readme = "../README.md"
authors = ["humacss"]
keywords = ["events", "history", "replay", "snapshots"]
categories = ["data-structures", "concurrency"]

[features]
monitor = ["contime-worker/monitor", "contime-core/monitor"]

[dependencies]
traitstub = "0.1.0"
contime-batcher = { path = "../../batcher/dev", version = "0.1.0" }
contime-core = { path = "../../core/dev", version = "0.1.0" }
contime-api = { path = "../../api/dev", version = "0.1.0" }
contime-events = { path = "../../events/dev", version = "0.1.0" }
contime-lanes = { path = "../../lanes/dev", version = "0.1.0" }
contime-progress = { path = "../../progress/dev", version = "0.1.0" }
contime-router = { path = "../../router/dev", version = "0.1.0" }
contime-worker = { path = "../../worker/dev", version = "0.1.0" }
contime-checkpoints = { package = "contime-snapshots", path = "../../snapshots/dev", version = "0.1.0" }
crossbeam-channel = "0.5"

[dev-dependencies]
rstest = { version = "0.26", default-features = false }
criterion = { version = "0.5", features = ["html_reports"] }
pprof = { version = "0.15", features = ["criterion", "flamegraph"] }

[[bench]]
name = "counters"
path = "../benches/counters.rs"
harness = false

[[bench]]
name = "runtime"
path = "../benches/runtime.rs"
harness = false

[[bench]]
name = "breakdown"
path = "../benches/breakdown.rs"
harness = false

[[bench]]
name = "batching"
path = "../benches/batching.rs"
harness = false

[lib]
path = "lib.rs"

[package.metadata.docs.rs]
all-features = true

[[test]]
name = "batching"
path = "../tests/batching.rs"
