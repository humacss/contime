[package]
name = "contime-monitor"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
autobenches = false
license = "MIT"
description = "Read-only worker-status monitoring and caller-driven workload accounting"
publish = ["crates-io"]
repository = "https://github.com/humacss/contime"
documentation = "https://docs.rs/contime-monitor"
readme = "README.md"
authors = ["humacss"]
keywords = ["events", "monitoring", "metrics", "snapshots"]
categories = ["data-structures"]
include = ["/Cargo.toml", "/LICENSE", "/README.md", "/src/**", "/tests/**", "/benches/**", "/examples/**"]

[features]
default = []
workers = ["dep:contime-worker", "dep:crossbeam-channel"]
runtime = ["workers", "dep:contime-runtime"]
counters = ["workers", "contime-worker/counters", "contime-runtime?/counters"]

[dependencies]
contime-worker = { path = "../worker", version = "0.1.0", optional = true }
contime-runtime = { path = "../runtime", version = "0.1.0", optional = true }
crossbeam-channel = { version = "0.5", optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
contime-runtime = { path = "../runtime", version = "0.1.0" }
crossbeam-channel = "0.5"

[[bench]]
name = "operations"
harness = false

[[bench]]
name = "arithmetic"
harness = false

[[bench]]
name = "pipeline"
harness = false

[[bench]]
name = "sustained"
harness = false

[[bench]]
name = "workers"
harness = false
required-features = ["runtime"]

[[bench]]
name = "activity"
harness = false
required-features = ["workers"]

[package.metadata.docs.rs]
all-features = true
