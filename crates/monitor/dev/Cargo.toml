[package]
name = "contime-monitor"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
autobenches = false
license = "MIT"
description = "Read-only worker-status monitoring and caller-driven workload accounting"
publish = false
repository = "https://github.com/humacss/contime"
documentation = "https://docs.rs/contime-monitor"
readme = "../README.md"
authors = ["humacss"]
keywords = ["events", "monitoring", "metrics", "snapshots"]
categories = ["data-structures"]

[features]
default = []
workers = ["monitor"]
monitor = ["dep:contime-worker", "dep:crossbeam-channel"]
runtime = ["workers", "dep:contime-runtime"]
counters = ["workers", "contime-worker/counters", "contime-runtime?/counters"]

[dependencies]
contime-worker = { path = "../../worker/dev", version = "0.1.0", optional = true }
contime-runtime = { path = "../../runtime/dev", version = "0.1.0", optional = true }
crossbeam-channel = { version = "0.5", optional = true }

[dev-dependencies]
contime = { path = "../../..", features = ["monitor", "simulator", "manual", "counters"] }
criterion = { version = "0.5", features = ["html_reports"] }
contime-runtime = { path = "../../runtime/dev", version = "0.1.0" }
crossbeam-channel = "0.5"

[[bench]]
name = "operations"
path = "../benches/operations.rs"
harness = false

[[bench]]
name = "arithmetic"
path = "../benches/arithmetic.rs"
harness = false

[[bench]]
name = "pipeline"
path = "../benches/pipeline.rs"
harness = false

[[bench]]
name = "sustained"
path = "../benches/sustained.rs"
harness = false

[[bench]]
name = "workers"
path = "../benches/workers.rs"
harness = false
required-features = ["runtime"]

[[bench]]
name = "activity"
path = "../benches/activity.rs"
harness = false
required-features = ["workers"]

[lib]
path = "lib.rs"

[package.metadata.docs.rs]
all-features = true

[[test]]
name = "activity"
path = "../tests/activity.rs"

[[test]]
name = "monitor"
path = "../tests/monitor.rs"

[[test]]
name = "operations"
path = "../tests/operations.rs"

[[test]]
name = "pipeline"
path = "../tests/pipeline.rs"

[[test]]
name = "sustained"
path = "../tests/sustained.rs"

[[test]]
name = "worker_runtime"
path = "../tests/worker_runtime.rs"

[[test]]
name = "workers"
path = "../tests/workers.rs"
