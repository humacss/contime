[package]
name = "contime-api"
version = "0.1.0"
edition = "2021"
autobenches = false
license = "MIT"
description = "Isolated API-side request and response processing for ConTime"
publish = false
repository = "https://github.com/humacss/contime"
documentation = "https://docs.rs/contime-api"
readme = "README.md"
authors = ["humacss"]
keywords = ["events", "history", "replay", "snapshots"]
categories = ["data-structures", "concurrency"]
include = ["/Cargo.toml", "/LICENSE", "/README.md", "/src/**", "/examples/**", "/tests/**", "/benches/**", "!**/docs/**", "!**/.DS_Store"]

[dependencies]
traitstub = { path = "../../../traitstub" }
crossbeam-channel = "0.5"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "query"
harness = false

[package.metadata.docs.rs]
all-features = true
