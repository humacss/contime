[package]
name = "contime-api"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
autobenches = false
license = "MIT"
description = "Isolated API-side request and response processing for ConTime"
publish = false
repository = "https://github.com/humacss/contime"
documentation = "https://docs.rs/contime-api"
readme = "../README.md"
authors = ["humacss"]
keywords = ["events", "history", "replay", "snapshots"]
categories = ["data-structures", "concurrency"]

[features]
manual = ["dep:contime-worker"]

[dependencies]
traitstub = "0.1.0"
crossbeam-channel = "0.5"
contime-worker = { path = "../../worker/dev", version = "0.1.0", optional = true }

[dev-dependencies]
contime = { path = "../../..", features = ["monitor", "simulator", "manual", "counters"] }
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "query"
path = "../benches/query.rs"
harness = false

[lib]
path = "lib.rs"

[package.metadata.docs.rs]
all-features = true
