[package]
name = "contime-progress"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "MIT"
description = "Policy-independent bounded progress measurement for ConTime"
publish = false
repository = "https://github.com/humacss/contime"
documentation = "https://docs.rs/contime-progress"
readme = "README.md"
authors = ["humacss"]
keywords = ["events", "history", "replay", "snapshots"]
categories = ["data-structures", "concurrency"]

[lib]
path = "src/lib.rs"

[package.metadata.docs.rs]
all-features = true

[[test]]
name = "coverage"
path = "tests/coverage.rs"

[[test]]
name = "round"
path = "tests/round.rs"

[dev-dependencies]
contime = { path = "../..", features = ["monitor", "simulator", "manual"] }
